<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Un catalogo di giochi per browser con ricerca e preferiti.">
<title>Home page - Classroom</title>
<link rel="icon" type="image/jpeg" href="assets/classroom-favicon.jpg">
<link rel="stylesheet" href="assets/arcade.css">
</head>
<body>
<header class="top"><div class="shell">
  <a class="brand" href="#" aria-label="Arcade, home">Arcade<span aria-hidden="true">.</span></a>
  <label class="top-search"><span class="icon-search" aria-hidden="true"></span><input id="search" type="search" aria-label="Cerca un gioco" placeholder="Cerca un gioco…" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
  <div class="header-actions">
    <button class="saved" type="button" id="favorites" aria-pressed="false">☆ Preferiti</button>
    <button class="saved" type="button" id="account-button">Accedi</button>
  </div>
</div></header>
<main class="shell">
  <div id="home">
    <section class="hero" id="hero">
      <div class="hero-text"><h1>Scegli.<br><em>Gioca.</em></h1><p id="hero-summary"></p><a href="#catalogo" class="primary">Esplora il catalogo <span aria-hidden="true">↓</span></a></div>
      <div class="hero-art">
        <img class="hero-image" src="assets/covers/plants-vs-zombies.webp" alt="">
        <a class="hero-game" href="#gioco/plants-vs-zombies"><span>Plants vs. Zombies</span><span aria-hidden="true">↗</span></a>
      </div>
    </section>
    <section id="catalogo" aria-labelledby="catalog-title">
      <div class="catalog-head"><h2 id="catalog-title" tabindex="-1">Tutti i giochi</h2><p id="count" class="count" aria-live="polite"></p></div>
      <div class="filters" id="filters" aria-label="Filtri del catalogo"></div>
      <div class="grid" id="games"></div>
      <p class="empty" id="empty" hidden></p>
    </section>
  </div>
  <section id="player" class="player" aria-labelledby="game-title" hidden>
    <div class="player-head">
      <button id="back" class="secondary" type="button">← Catalogo</button>
      <img id="player-cover" class="player-cover" alt="" hidden>
      <h1 id="game-title" tabindex="-1"></h1>
      <button id="fullscreen" class="secondary" type="button">Schermo intero</button>
    </div>
    <div id="frame-slot"></div>
    <p class="player-note" id="player-note" aria-live="polite" hidden></p>
  </section>
</main>
<dialog id="account-dialog">
  <form id="account-form">
    <h2 id="account-title">Account Arcade</h2>
    <p id="account-mode"></p>
    <div id="account-fields">
      <label>Username <input name="username" autocomplete="username" minlength="3" maxlength="24" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
    </div>
    <p id="account-status" role="status"></p>
    <div class="account-actions">
      <button class="secondary" type="button" id="account-close">Chiudi</button>
      <button class="secondary" type="button" id="account-switch">Crea account</button>
      <button class="secondary" type="submit" id="account-submit">Accedi</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
const games = JSON.parse(document.getElementById('game-data').textContent);
const byId = new Map(games.map(game => [game.id, game]));
const get = id => document.getElementById(id);
const search = get('search');
const favoritesButton = get('favorites');
const accountForm = get('account-form');
const accountDialog = get('account-dialog');
const accountButton = get('account-button');
const serverMode = true;
let username = null;
let register = false;
let playerRequest = 0;

async function accountApi(action, data) {
  if (action === 'logout') return {username:null};
  const response = await fetch('https://usrvjyffaoucyahkpyjw.supabase.co/functions/v1/clever-handler', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({...data,action})
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'Operazione non riuscita.');
  return result;
}

function accountView() {
  get('account-fields').hidden = !serverMode || Boolean(username);
  get('account-switch').hidden = !serverMode || Boolean(username);
  get('account-submit').hidden = !serverMode;
  get('account-submit').textContent = username ? 'Esci' : register ? 'Registrati' : 'Accedi';
  get('account-switch').textContent = register ? 'Torna al login' : 'Crea account';
  accountForm.elements.password.autocomplete = register ? 'new-password' : 'current-password';
  accountButton.textContent = username || 'Accedi';
  get('account-mode').textContent = !serverMode
    ? 'Apri Arcade con Avvia-Arcade.cmd per usare gli account.'
    : username ? 'Profilo attivo: ' + username : 'Usa username e password.';
}

accountButton.addEventListener('click', () => {
  register = false;
  get('account-status').textContent = '';
  accountView();
  accountDialog.showModal();
});
get('account-close').addEventListener('click', () => accountDialog.close());
get('account-switch').addEventListener('click', () => {
  register = !register;
  get('account-status').textContent = '';
  accountView();
});
accountForm.addEventListener('submit', async event => {
  event.preventDefault();
  const submit = get('account-submit');
  submit.disabled = true;
  try {
    const result = username ? await accountApi('logout',{}) : await accountApi(register ? 'register' : 'login',{
      username:accountForm.elements.username.value,
      password:accountForm.elements.password.value
    });
    username = result.username;
    accountForm.reset();
    accountView();
    accountDialog.close();

  } catch (error) {
    get('account-status').textContent = error.message;
  } finally {
    submit.disabled = false;
  }
});

accountView();
let activeFilter = 'Tutti';
let onlyFavorites = false;
let lastCardId = '';
let favorites = new Set();
try {
  const saved = JSON.parse(localStorage.getItem('arcade-favorites-v1') || '[]');
  if (Array.isArray(saved)) favorites = new Set(saved.filter(id => byId.has(id)));
} catch {}

const categories = ['Tutti', ...new Set(games.map(game => game.category))];
const normalize = value => value.toLocaleLowerCase('it').normalize('NFD').replace(/\p{M}/gu,'');
get('hero-summary').textContent = games.length ? games.length + ' giochi da esplorare' : 'Il catalogo è in preparazione.';

function makeCard(game) {
  const card = document.createElement('article');
  card.className = 'card';
  const link = document.createElement('a');
  link.className = 'game-link';
  link.href = '#gioco/' + game.id;
  link.dataset.game = game.id;
  const cover = document.createElement('div');
  cover.className = 'cover';
  cover.style.setProperty('--hue', game.color);
  const initials = document.createElement('b');
  initials.textContent = game.id === '2048' ? '2048' : game.title.split(/\s+/).slice(0, 2).map(word => word[0]).join('').toUpperCase();
  initials.setAttribute('aria-hidden','true');
  cover.append(initials);
  if (game.cover) {
    const artwork = document.createElement('img');
    artwork.src = game.cover;
    artwork.alt = '';
    artwork.loading = 'lazy';
    artwork.decoding = 'async';
    artwork.addEventListener('error', () => artwork.remove(), {once: true});
    cover.append(artwork);
  }
  const version = game.version;
  if (version) {
    const label = document.createElement('span');
    label.className = 'cover-version';
    label.textContent = version;
    label.setAttribute('aria-hidden', 'true');
    cover.append(label);
  }

  const copy = document.createElement('div');
  copy.className = 'card-copy';
  const name = document.createElement('h3');
  name.textContent = game.title;
  const meta = document.createElement('small');
  meta.textContent = game.edition;
  copy.append(name, meta);
  link.append(cover, copy);
  const star = document.createElement('button');
  star.className = 'star';
  star.type = 'button';
  const isSaved = favorites.has(game.id);
  star.textContent = isSaved ? '★' : '☆';
  star.setAttribute('aria-pressed', String(isSaved));
  star.setAttribute('aria-label', (isSaved ? 'Rimuovi dai preferiti: ' : 'Aggiungi ai preferiti: ') + game.title);
  star.addEventListener('click', () => {
    if (favorites.has(game.id)) favorites.delete(game.id);
    else favorites.add(game.id);
    try { localStorage.setItem('arcade-favorites-v1', JSON.stringify([...favorites])); } catch {}
    if (onlyFavorites && isSaved) { render(); get('catalog-title').focus({preventScroll:true}); return; }
    const updated = makeCard(game);
    card.replaceWith(updated);
    updated.querySelector('button').focus({preventScroll:true});
  });
  card.append(link, star);
  return card;
}

function render() {
  const query = normalize(search.value.trim());
  const matches = games.filter(game =>
    (!onlyFavorites || favorites.has(game.id)) &&
    (activeFilter === 'Tutti' || activeFilter === game.category) &&
    normalize(game.title).includes(query)
  );
  get('games').replaceChildren(...matches.map(makeCard));
  get('count').textContent = matches.length + (matches.length === 1 ? ' gioco' : ' giochi');
  get('catalog-title').textContent = onlyFavorites ? 'Preferiti' : 'Tutti i giochi';
  get('hero').hidden = Boolean(query || onlyFavorites);
  get('empty').hidden = matches.length !== 0;
  get('empty').textContent = onlyFavorites && !query ? 'Usa la stella sulle schede per aggiungere un gioco ai preferiti.' : games.length ? 'Nessun gioco trovato.' : 'Il catalogo è ancora vuoto.';
}

for (const category of categories) {
  const button = document.createElement('button');
  button.className = 'filter';
  button.type = 'button';
  button.textContent = category;
  button.setAttribute('aria-pressed', String(category === activeFilter));
  button.addEventListener('click', () => {
    activeFilter = category;
    for (const item of get('filters').children) item.setAttribute('aria-pressed', String(item === button));
    render();
  });
  get('filters').append(button);
}

function showHome() {
  playerRequest++;
  get('player').hidden = true;
  get('frame-slot').replaceChildren();
  get('home').hidden = false;
}

async function showGame(game) {
  const request = ++playerRequest;
  get('home').hidden = true;
  get('player').hidden = false;
  get('game-title').textContent = game.title;
  const playerCover = get('player-cover');
  playerCover.hidden = !game.cover;
  if (game.cover) playerCover.src = game.cover;
  const note = get('player-note');
  note.textContent = game.notice || '';
  note.hidden = !game.notice;
  const frame = document.createElement('iframe');
  frame.className = 'player-frame game-' + game.id;
  frame.title = game.title;
  frame.allowFullscreen = true;
  frame.allow = 'autoplay; fullscreen; gamepad *; keyboard-map *;';
  get('frame-slot').replaceChildren();
  frame.sandbox = 'allow-scripts allow-pointer-lock';
  frame.src = game.url;
  if (request !== playerRequest) return;
  get('frame-slot').replaceChildren(frame);
  get('fullscreen').hidden = typeof frame.requestFullscreen !== 'function';
  get('game-title').focus({preventScroll:true});
  window.scrollTo(0,0);
}

function route() {
  const game = byId.get(location.hash.slice('#gioco/'.length));
  if (location.hash.startsWith('#gioco/') && game) { lastCardId = game.id; showGame(game); return; }
  showHome();
  if (location.hash === '#catalogo') get('catalog-title').focus({preventScroll:true});
  else if (lastCardId) {
    get('games').querySelector('[data-game="' + lastCardId + '"]')?.focus({preventScroll:true});
    lastCardId = '';
  }
}

search.addEventListener('input', () => {
  if (!get('player').hidden) location.hash = '#catalogo';
  render();
});
favoritesButton.addEventListener('click', () => {
  if (!get('player').hidden) location.hash = '#catalogo';
  onlyFavorites = !onlyFavorites;
  favoritesButton.setAttribute('aria-pressed', String(onlyFavorites));
  render();
});
get('back').addEventListener('click', () => { location.hash = '#catalogo'; });
get('fullscreen').addEventListener('click', async () => {
  const frame = get('frame-slot').querySelector('iframe');
  if (!frame) return;
  try { await frame.requestFullscreen(); frame.focus(); }
  catch {
    const note = get('player-note');
    note.textContent = 'Schermo intero non disponibile in questo browser.';
    note.hidden = false;
  }
});
document.querySelector('.brand').addEventListener('click', () => {
  search.value = '';
  onlyFavorites = false;
  favoritesButton.setAttribute('aria-pressed', 'false');
  get('filters').firstElementChild.click();
  window.scrollTo(0,0);
});
document.addEventListener('keydown', event => {
  if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey && !event.target.closest('input, textarea, [contenteditable]')) {
    event.preventDefault();
    search.focus();
  }
});
window.addEventListener('hashchange', route);
render();
route();
</script>
</body>
</html>
