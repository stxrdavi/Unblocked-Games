<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caricamento gioco</title>
<style>
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #171122; color: white; font: 16px system-ui; }
</style>
</head>
<body>
<p id="status" role="status">Scaricamento del gioco…</p>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const game = params.get('game');
const playerOrigin = location.hostname === 'www.calcolatrice.website.'
  ? 'https://www.calcolatrice.website' : location.origin;
const status = document.getElementById('status');

function loadScript(path) {
  return new Promise(resolve => {
    const script = document.createElement('script');
    script.src = path;
    script.onload = script.onerror = resolve;
    document.head.append(script);
  });
}

async function prepareGame() {
  if (params.has('reset')) {
    await loadScript('../assets/reset-storage.js?v=1');
    window.prepareArcadeResetStorage(game, params.get('reset'));
  }
  if (game === 'eaglecraft-26-3') {
    await loadScript('../assets/minecraft-relay.js?v=2');
    try { window.configureArcadeMinecraftRelay(); } catch {}
  }
  if (params.get('sync') === '1') {
    await Promise.all([
      loadScript('../assets/save-bridge.js?v=2'),
      loadScript('../assets/game-saves.js?v=1')
    ]);
    try {
      if (Object.hasOwn(arcadeSaveKeys, game)) {
        await window.prepareArcadeSaves(game, arcadeSaveKeys[game], playerOrigin);
      }
    } catch {}
  }
}

function reportDownload(percent) {
  parent.postMessage({type:'arcade-game-progress', percent}, playerOrigin);
  status.textContent = percent === null || percent === 100
    ? 'Avvio del gioco…' : 'Scaricamento del gioco… ' + percent + '%';
}

async function readGame(url, plain) {
  const response = await fetch(url.href + (plain ? '' : '.gz'), {priority:'high'});
  if (!response.ok || !response.body) throw new Error('Scaricamento non riuscito');
  // Fetch exposes decoded bytes, so the length is comparable only if HTTP
  // did not add its own compression on top of the game file.
  const total = Number(response.headers.get('Content-Length'));
  const encoding = response.headers.get('Content-Encoding');
  let stream = response.body;
  if (total > 0 && (!encoding || encoding === 'identity')) {
    let downloaded = 0;
    let lastPercent = -1;
    let lastUpdate = 0;
    stream = stream.pipeThrough(new TransformStream({
      transform(chunk, controller) {
        downloaded += chunk.byteLength;
        const percent = Math.min(99, Math.floor(downloaded * 100 / total));
        const now = performance.now();
        if (percent !== lastPercent && (lastPercent === -1 || now - lastUpdate >= 100)) {
          lastPercent = percent;
          lastUpdate = now;
          reportDownload(percent);
        }
        controller.enqueue(chunk);
      }
    }));
  }
  if (!plain) stream = stream.pipeThrough(new DecompressionStream('gzip'));
  const source = await new Response(stream).text();
  reportDownload(total > 0 && (!encoding || encoding === 'identity') ? 100 : null);
  return source;
}

async function launch() {
  if (!game || !/^[a-z0-9-]{1,80}$/.test(game)) {
    throw new Error('Gioco non disponibile');
  }
  const url = new URL(game+'/index.html', location.href);
  const [source] = await Promise.all([
    readGame(url, params.get('plain') === '1'),
    loadScript('../assets/game-audio.js'),
    prepareGame()
  ]);
  const base = /<base\b[^>]*\bhref\s*=\s*["']([^"']*)["']/i;
  const html = base.test(source)
    ? source.replace(base, (tag, href) => tag.replace(/(\bhref\s*=\s*)(["'])[^"']*\2/i,
        (_, attribute, quote) => attribute + quote + new URL(href, url).href + quote))
    : source.replace(/^(\s*<!doctype[^>]*>)?/i, '$&<base href="'+url.href+'">');
  document.open();
  document.write(html);
  document.close();
  parent.postMessage({type:'arcade-game-opened'}, playerOrigin);
}

launch().catch(() => {
  parent.postMessage({type:'arcade-game-failed'}, playerOrigin);
  status.textContent = 'Impossibile caricare il gioco.';
});
</script>
</body>
</html>
