<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caricamento gioco</title>
<script src="../assets/game-audio.js"></script>
<style>
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #171122; color: white; font: 16px system-ui; }
</style>
</head>
<body>
<p id="status" role="status">Scaricamento del gioco…</p>
<script>
'use strict';
const game = new URLSearchParams(location.search).get('game');
const status = document.getElementById('status');

async function launch() {
  if (location.origin !== 'https://www.calcolatrice.website.' || !game || !/^[a-z0-9-]{1,80}$/.test(game)) {
    throw new Error('Gioco non disponibile');
  }
  const url = new URL(game+'/index.html', location.href);
  const response = await fetch(url.href+'.gz');
  if (!response.ok || !response.body) throw new Error('Scaricamento non riuscito');
  const stream = response.body.pipeThrough(new DecompressionStream('gzip'));
  const source = await new Response(stream).text();
  const base = /<base\b[^>]*\bhref\s*=\s*["']([^"']*)["']/i;
  const html = base.test(source)
    ? source.replace(base, (tag, href) => tag.replace(/(\bhref\s*=\s*)(["'])[^"']*\2/i,
        (_, attribute, quote) => attribute + quote + new URL(href, url).href + quote))
    : source.replace(/^(\s*<!doctype[^>]*>)?/i, '$&<base href="'+url.href+'">');
  document.open();
  document.write(html);
  document.close();
  parent.postMessage({type:'arcade-game-opened'}, 'https://www.calcolatrice.website');
}

launch().catch(() => {
  parent.postMessage({type:'arcade-game-failed'}, 'https://www.calcolatrice.website');
  status.textContent = 'Impossibile caricare il gioco.';
  const retry = document.createElement('button');
  retry.textContent = 'Riprova';
  retry.onclick = () => location.reload();
  status.after(retry);
});
</script>
</body>
</html>
